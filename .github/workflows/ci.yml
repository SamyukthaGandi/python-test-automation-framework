name: Python Test Automation CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run API UI DB Automation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run smoke tests first
        run: |
          mkdir -p reports
          pytest -m smoke --html=reports/smoke_report.html --self-contained-html

      - name: Run full regression suite in parallel
        run: |
          pytest -n auto --reruns 1 --reruns-delay 1 --html=reports/pytest_report.html --self-contained-html --alluredir=reports/allure-results

      - name: Upload test reports and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-test-reports
          path: |
            reports/
          retention-days: 14

  docker-test:
    name: Validate Dockerized Test Execution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t python-sdet-framework .

      - name: Run tests inside Docker
        run: docker run --rm -v ${{ github.workspace }}/reports:/app/reports python-sdet-framework

      - name: Upload Docker run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-test-reports
          path: reports/
          retention-days: 14
